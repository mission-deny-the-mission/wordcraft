# Runs the wordcraft-cli storage self-test binary against the same DAV endpoint.
# PRECONDITIONS (checked at launch, not before):
#   1. The StorageBackend sibling has pushed a test image; update `image:` below
#      from the REPLACE-ME tag to the real tag.
#   2. The exact CLI self-test invocation is confirmed; update `args:` below.
#      (Current values are the expected shape, not yet confirmed with the sibling.)
#   3. Out-of-band Secret `craft-storage-test-dav` (key `token`) exists (see README).
#   4. The token's user is provisioned in oCIS (see README blocker note).
# No secret values live in this file; the token arrives via secretKeyRef only.
apiVersion: batch/v1
kind: Job
metadata:
  name: wordcraft-cli-storage-test
  namespace: craft-storage-test
  labels:
    app.kubernetes.io/part-of: craft-storage-harness
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        job: wordcraft-cli-storage-test
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: forgejo-registry # copied out-of-band from ns craft at launch (see README)
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wordcraft-cli
          # TODO(storage-sibling): replace with the pushed test-binary tag.
          image: git.harryslab2.xyz/harry/wordcraft-cli-test:REPLACE-ME
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: CRAFT_DAV_BASE
              value: http://proxy.ocis.svc.cluster.local:9200
            - name: CRAFT_DAV_USER
              value: ocis-e2e-tmp
            - name: CRAFT_DAV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: craft-storage-test-dav
                  key: token
          # TODO(storage-sibling): replace with the real StorageBackend self-test invocation.
          command: ["/wordcraft-cli", "storage-selftest"]
