# Staging copy of the craft-web Deployment for serving patched WASM builds.
# Deliberately NO Ingress: reachable only in-cluster / via port-forward while testing.
# Retarget to a patched image at test time, e.g.:
#   kubectl -n craft-storage-test set image deploy/craft-web-test nginx=git.harryslab2.xyz/harry/craft-web:<patched-tag>
# (forgejo-registry pull secret is copied out-of-band from ns craft at launch; see README.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: craft-web-test
  namespace: craft-storage-test
  labels:
    app.kubernetes.io/part-of: craft-storage-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: craft-web-test
  template:
    metadata:
      labels:
        app: craft-web-test
    spec:
      imagePullSecrets:
        - name: forgejo-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: git.harryslab2.xyz/harry/craft-web:0.1.0-tinymm1
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: craft-web-test
  namespace: craft-storage-test
  labels:
    app.kubernetes.io/part-of: craft-storage-harness
spec:
  type: ClusterIP
  selector:
    app: craft-web-test
  ports:
    - name: http
      port: 80
      targetPort: http
